name: Deploy documentation

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  repository_dispatch:
    types: [source-docs-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation
        uses: actions/checkout@v4

      - name: Check out Python implementation
        uses: actions/checkout@v4
        with:
          repository: MagicRodri/polyadmin
          path: sources/python

      - name: Check out Go implementation
        uses: actions/checkout@v4
        with:
          repository: MagicRodri/go-polyadmin
          path: sources/go

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build documentation
        run: |
          python -m pip install mkdocs-material
          for page in architecture audit authentication dashboard deletes exports i18n inlines lists model-admin permissions routing templates; do
            cp "sources/python/docs/${page}.md" "docs/${page}.md"
          done
          mkdir -p docs/go/reference
          cp -R sources/go/docs/. docs/go/reference/
          rm -f docs/components.md docs/go/reference/components.md
          sed -i 's|(components.md)|(concepts/frontend.md)|g' docs/architecture.md docs/templates.md
          sed -i 's|(components.md)|(../../concepts/frontend.md)|g' docs/go/reference/architecture.md docs/go/reference/templates.md
          mkdocs build --strict

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4